[package]
name = "radar-cli"
description = "Radar's operator command line. Reads live state and computes nothing it does not have."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "radar"
path = "src/main.rs"

[dependencies]
radar-asof.workspace = true
radar-graph.workspace = true
radar-backfill.workspace = true
radar-decode.workspace = true
radar-instruments.workspace = true
radar-exec.workspace = true
radar-risk.workspace = true
radar-sim.workspace = true
# The on-demand chain read behind `radar dossier`. Read-only: it holds no key,
# has no signer in its tree, and cannot reach the execution path.
radar-onchain.workspace = true
radar-journal.workspace = true
radar-model.workspace = true
radar-strategy.workspace = true
radar-research.workspace = true
radar-store.workspace = true
radar-types.workspace = true
# `audit`, `replay` and the brief's serving check read and write JSON.
serde_json.workspace = true

# The brief's serving check asks the public surface how it is. Already in the
# workspace tree via radar-sim, radar-serve and radar-backfill, so this adds a
# dependency edge rather than a dependency.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"
# Test-only. The curve fixture a `consider` test prices an exit against needs
# `BondingCurve` by name, and `radar-sim` re-exports the quoter but not the
# layout it is built from. Already in the tree via `radar-sim`, so this is an
# edge rather than a dependency.
radar-pumpfun.workspace = true

[lints]
workspace = true
